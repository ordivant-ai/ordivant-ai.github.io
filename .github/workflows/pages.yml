name: Publish documentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: documentation-site
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: source
        name: Check public documentation revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(gh api repos/ordivant-ai/ordivant/commits/main --jq .sha)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          previous="$(cat source-revision.txt 2>/dev/null || true)"
          if [ "$revision" != "$previous" ] || [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ordivant-ai/ordivant
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - name: Build and verify translated documentation
        run: |
          npm run build --prefix docs
          python3 scripts/check_docs.py
      - name: Record source revision
        env:
          SOURCE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: printf '%s\n' "$SOURCE_REVISION" > docs/.vitepress/dist/source-revision.txt
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Save published revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          existing="$(gh api repos/ordivant-ai/ordivant-ai.github.io/contents/source-revision.txt --jq .sha 2>/dev/null || true)"
          content="$(printf '%s\n' "$SOURCE_REVISION" | base64 -w 0)"
          if [ -n "$existing" ]; then
            gh api --method PUT repos/ordivant-ai/ordivant-ai.github.io/contents/source-revision.txt -f message='Record published documentation revision' -f content="$content" -f sha="$existing" > /dev/null
          else
            gh api --method PUT repos/ordivant-ai/ordivant-ai.github.io/contents/source-revision.txt -f message='Record published documentation revision' -f content="$content" > /dev/null
          fi
